<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a21">
<title>Estudio BBS</title>
<link rel="icon" href="icono.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --fondo: #171a21; --panel: #20242d; --panel2: #2a2f3a; --borde: #3a4150; --texto: #e8ebf0; --suave: #9aa3b2; --acento: #6fb24a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--fondo); color: var(--texto); font: 15px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  #barra { display: none; align-items: center; gap: 8px; padding: 4px 8px; padding-top: max(4px, env(safe-area-inset-top)); background: var(--panel); border-bottom: 1px solid var(--borde); }
  body.en-modo #barra { display: flex; }
  #barra button { font: inherit; color: var(--texto); background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  #barra button.activo { background: var(--acento); color: #102010; border-color: var(--acento); font-weight: 600; }
  #barra .nombre { font-weight: 600; margin-right: 4px; }
  #atajos { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; }
  #barra #btnOcultar { flex: none; padding: 4px 9px; font-size: 16px; line-height: 1; }
  /* barra escondida: toda la pantalla es del modo, y queda una burbuja chica que se puede arrastrar a un costado */
  body.barra-oculta #barra { display: none !important; }
  body.barra-oculta #marcos iframe { top: env(safe-area-inset-top, 0px); height: calc(100% - env(safe-area-inset-top, 0px)); }
  #burbuja { display: none; position: fixed; z-index: 50; width: 38px; height: 38px; padding: 0; border-radius: 50%; border: 1px solid var(--borde); background: rgba(32,36,45,.82); color: var(--texto); font-size: 19px; line-height: 1; cursor: pointer; touch-action: none; user-select: none; box-shadow: 0 2px 8px rgba(0,0,0,.45); opacity: .72; transition: opacity .15s, left .18s, right .18s; align-items: center; justify-content: center; }
  body.en-modo.barra-oculta #burbuja { display: flex; }
  #burbuja:hover, #burbuja.arrastrando { opacity: 1; }
  #burbuja.arrastrando { transition: none; }
  /* franja de arriba (solo con la barra escondida): deslizar hacia abajo desde ahí trae la barra de vuelta */
  #tirador { display: none; position: fixed; z-index: 49; top: 0; left: 0; right: 0; height: 22px; touch-action: none; }
  #tirador i { position: absolute; top: 5px; left: 50%; width: 44px; height: 4px; margin-left: -22px; border-radius: 2px; background: rgba(232,235,240,.5); transition: background .15s, transform .15s; }
  #tirador.tirando i { background: var(--acento); transform: translateY(4px); }
  body.en-modo.barra-oculta #tirador { display: block; }
  #marcos { flex: 1; position: relative; }
  #marcos iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--fondo); }
  #marcos iframe.visible { display: block; }
  #menu { flex: 1; overflow: auto; padding: 24px 16px; padding-top: max(24px, env(safe-area-inset-top)); }
  body.en-modo #menu { display: none; }
  body:not(.en-modo) #marcos { display: none; }
  #menu h1 { margin: 0 0 4px; font-size: 26px; display: flex; align-items: center; gap: 10px; }
  #menu h1 img { width: 36px; height: 36px; image-rendering: pixelated; }
  #menu .sub { color: var(--suave); margin: 0 0 20px; }
  #tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; max-width: 1100px; }
  .tarjeta { text-align: left; font: inherit; color: var(--texto); background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 140px; }
  .tarjeta:hover, .tarjeta:focus-visible { border-color: var(--acento); background: var(--panel2); outline: none; }
  .tarjeta .ico { font-size: 34px; }
  .tarjeta b { font-size: 18px; }
  .tarjeta span { color: var(--suave); font-size: 14px; }
  .tarjeta .nota { color: #e8c15a; font-size: 13px; }
  #pie { color: var(--suave); font-size: 13px; margin-top: 22px; }
  @media (max-width: 600px) {
    #barra .nombre { display: none; }
    #atajos button { padding: 4px 10px; font-size: 18px; }
    #atajos .txt { display: none; }
    #atajos button.activo .txt { display: inline; font-size: 15px; }
    /* celu: los 9 modos juntos en una sola pantalla, sin scrollear */
    #menu { padding: 12px 10px; padding-top: max(12px, env(safe-area-inset-top)); }
    #menu h1 { font-size: 20px; margin-bottom: 2px; }
    #menu h1 img { width: 28px; height: 28px; }
    #menu .sub { font-size: 12px; margin-bottom: 10px; }
    #tarjetas { grid-template-columns: 1fr 1fr; gap: 8px; }
    .tarjeta { min-height: 0; padding: 10px; gap: 2px; border-radius: 12px; }
    .tarjeta .ico { font-size: 24px; line-height: 1.1; }
    .tarjeta b { font-size: 15px; }
    .tarjeta span { font-size: 11.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tarjeta .nota { display: none; }
    #pie { margin-top: 10px; font-size: 11.5px; }
    @media (max-height: 660px) { #menu .sub, #pie { display: none; } .tarjeta span { -webkit-line-clamp: 2; } }
    @media (max-height: 700px) { #menu { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: 8px; } #tarjetas { gap: 6px; } .tarjeta { padding: 7px 9px; } .tarjeta .ico { font-size: 21px; } .tarjeta b { font-size: 14px; } }
  }
</style>
</head>
<body>
<div id="barra">
  <button id="volver" title="Volver al menú">☰ Menú</button>
  <span class="nombre">Estudio BBS</span>
  <div id="atajos"></div>
  <button id="btnOcultar" title="Esconder esta barra (queda una burbuja para volver a abrirla)" aria-label="Esconder la barra">⌃</button>
</div>
<div id="tirador" aria-hidden="true"><i></i></div>
<button id="burbuja" title="Tocá para abrir el menú · arrastrá para moverla (o deslizá hacia abajo desde el borde de arriba)" aria-label="Abrir el menú">☰</button>
<main id="menu">
  <h1><img src="icono.svg" alt="">Estudio BBS <small style="font-size:14px;font-weight:400;color:#9aa3b2">v.047 - <script>document.write(location.hostname.endsWith('github.io') ? 'web' : 'interna')</script></small></h1>
  <p class="sub">Elegí qué querés hacer. Podés pasar de un modo a otro sin perder lo que estabas haciendo.</p>
  <div id="tarjetas"></div>
  <p id="pie"></p>
</main>
<div id="marcos"></div>
<script type="module">
const MODOS = [
  { id: 'visor', ico: '👀', nombre: 'Visor', texto: 'Mirá tus forms, modelos y texturas de BBS en 3D.' },
  { id: 'randomizer', ico: '🎲', nombre: 'Randomizer', texto: 'Armá grupos de personajes de fondo al azar para BBS.' },
  { id: 'mocap', ico: '🎥', nombre: 'Mocap', texto: 'Pasá un video tuyo (cuerpo, ojos y boca) a un film de BBS.' },
  { id: 'director', ico: '🎬', nombre: 'Director', texto: 'Bocas, parpadeos y miradas solos, y el guion de escena.', notaCelu: 'En el celu la boca sale simple; exacta solo en la PC.' },
  { id: 'editor', ico: '🎞', nombre: 'Editor', texto: 'Animá personajes, poses y cámaras como en BBS, también desde el celu. Con guion de escena y cámaras automáticas (pestaña Director).' },
  { id: 'animaciones', ico: '🦴', nombre: 'Animaciones → BBS', texto: 'Pasá una animación 3D de cualquier esqueleto humanoide (FBX, GLB, BVH, DAE o .zip: Mixamo, Sketchfab, Blender, Unreal…) a un film de BBS, viendo la original y la de Minecraft lado a lado.' },
  { id: 'movil', ico: '📱', nombre: 'Celu en movimiento', texto: 'Grabá cómo movés el celular (giro y aceleración) y mirá la repetición en 3D.' },
  { id: 'convertidor', ico: '🧱', nombre: "Armourer's → BBS", texto: "Arregla los .obj que exporta Armourer's Workshop para usarlos como modelo en BBS." },
  { id: 'ojos', ico: '🧩', nombre: 'Crafteo', texto: 'Armá lo que le falta a tu personaje desde su skin: ojos, cejas, máscaras de borrado y más.' },
];
const $ = (s) => document.querySelector(s);
const marcos = new Map();
const esCelu = matchMedia('(pointer: coarse)').matches && !navigator.userAgent.includes('Windows');

for (const m of MODOS) {
  const b = document.createElement('button');
  b.className = 'tarjeta'; b.dataset.modo = m.id;
  b.innerHTML = `<div class="ico">${m.ico}</div><b>${m.nombre}</b><span>${m.texto}</span>` + (m.notaCelu && esCelu ? `<span class="nota">${m.notaCelu}</span>` : '');
  b.onclick = () => abrir(m.id);
  $('#tarjetas').append(b);
  const a = document.createElement('button');
  a.innerHTML = `${m.ico}<span class="txt"> ${m.nombre}</span>`; a.title = m.nombre; a.dataset.modo = m.id;
  a.onclick = () => abrir(m.id);
  $('#atajos').append(a);
}

function abrir(id, guardar = true) {
  const m = MODOS.find((x) => x.id === id);
  if (!m) return menu();
  let f = marcos.get(id);
  if (!f) {   // cada modo se carga la primera vez que se abre y después queda vivo
    f = document.createElement('iframe');
    f.src = `${id}/index.html`; f.title = m.nombre;
    f.allow = 'camera; microphone; fullscreen; clipboard-read; clipboard-write; web-share; hid; accelerometer; gyroscope; magnetometer';
    $('#marcos').append(f); marcos.set(id, f);
  }
  for (const [k, x] of marcos) x.classList.toggle('visible', k === id);
  for (const b of $('#atajos').children) b.classList.toggle('activo', b.dataset.modo === id);
  $('#burbuja').textContent = m.ico;   // la burbuja muestra en qué modo estás
  document.body.classList.add('en-modo');
  document.title = m.nombre + ' · Estudio BBS';
  if (guardar && location.hash !== '#' + id) history.pushState(null, '', '#' + id);
  try { localStorage.setItem('estudio_modo', id); } catch { /* sin almacenamiento */ }
  f.focus();
}
function menu(guardar = true) {
  document.body.classList.remove('en-modo');
  for (const x of marcos.values()) x.classList.remove('visible');
  document.title = 'Estudio BBS';
  if (guardar && location.hash) history.pushState(null, '', location.pathname);
}
$('#volver').onclick = () => menu();

// ---- barra de arriba escondible: se cierra a una burbuja chica que se puede mover (se acuerda dónde la dejaste) ----
const B = $('#burbuja');
let pos = { lado: 'r', y: 0.45 };
try { pos = { ...pos, ...JSON.parse(localStorage.getItem('estudio_burbuja') || '{}') }; } catch { /* sin almacenamiento */ }
function ubicarBurbuja() {
  const alto = Math.max(1, innerHeight - 38 - 16);
  B.style.top = Math.round(8 + Math.min(1, Math.max(0, pos.y)) * alto) + 'px';
  B.style.left = pos.lado === 'l' ? '6px' : 'auto'; B.style.right = pos.lado === 'r' ? '6px' : 'auto';
}
function ponerBarra(oculta, guardar = true) {
  document.body.classList.toggle('barra-oculta', oculta);
  if (guardar) { try { localStorage.setItem('estudio_barra_oculta', oculta ? '1' : '0'); } catch { /* sin almacenamiento */ } }
  ubicarBurbuja();
  // los modos dentro de los iframes se acomodan solos al cambiar el alto; se avisa por si alguno mide a mano
  setTimeout(() => marcos.forEach((f) => { try { f.contentWindow.dispatchEvent(new Event('resize')); } catch { /* otro origen */ } }), 60);
}
$('#btnOcultar').onclick = () => ponerBarra(true);
// deslizar hacia abajo desde el borde de arriba: abre la barra (también sirve con el mouse)
const T = $('#tirador');
let tira = null;
T.addEventListener('pointerdown', (e) => { tira = { x: e.clientX, y: e.clientY }; T.setPointerCapture(e.pointerId); T.classList.add('tirando'); });
T.addEventListener('pointermove', (e) => {
  if (!tira) return;
  const dy = e.clientY - tira.y, dx = e.clientX - tira.x;
  if (dy > 28 && dy > Math.abs(dx)) { tira = null; T.classList.remove('tirando'); ponerBarra(false); }
});
const sueltaTira = () => { tira = null; T.classList.remove('tirando'); };
T.addEventListener('pointerup', sueltaTira); T.addEventListener('pointercancel', sueltaTira);
let arr = null;
B.addEventListener('pointerdown', (e) => { arr = { x: e.clientX, y: e.clientY, mov: false }; B.setPointerCapture(e.pointerId); });
B.addEventListener('pointermove', (e) => {
  if (!arr) return;
  if (!arr.mov && Math.hypot(e.clientX - arr.x, e.clientY - arr.y) < 7) return;
  arr.mov = true; B.classList.add('arrastrando');
  B.style.left = Math.min(innerWidth - 44, Math.max(6, e.clientX - 19)) + 'px'; B.style.right = 'auto';
  B.style.top = Math.min(innerHeight - 46, Math.max(8, e.clientY - 19)) + 'px';
});
B.addEventListener('pointerup', (e) => {
  if (!arr) return;
  const mov = arr.mov; arr = null; B.classList.remove('arrastrando');
  if (!mov) return ponerBarra(false);
  pos = { lado: e.clientX < innerWidth / 2 ? 'l' : 'r', y: (e.clientY - 19 - 8) / Math.max(1, innerHeight - 38 - 16) };   // se pega al costado más cercano
  try { localStorage.setItem('estudio_burbuja', JSON.stringify(pos)); } catch { /* sin almacenamiento */ }
  ubicarBurbuja();
});
B.addEventListener('pointercancel', () => { arr = null; B.classList.remove('arrastrando'); ubicarBurbuja(); });
addEventListener('resize', ubicarBurbuja);
let oculta = false; try { oculta = localStorage.getItem('estudio_barra_oculta') === '1'; } catch { /* sin almacenamiento */ }
ponerBarra(oculta, false);
addEventListener('popstate', () => (location.hash ? abrir(location.hash.slice(1), false) : menu(false)));
addEventListener('message', (e) => {   // un modo puede pedir pasar a otro: postMessage({estudio:true, abrir:'visor'})
  if (e.origin === location.origin && e.data && e.data.estudio && e.data.abrir) abrir(e.data.abrir);
});

fetch('/pc/hola').then((r) => (r.ok ? r.json() : null)).catch(() => null).then((d) => {
  $('#pie').textContent = d && d.pc
    ? 'Abierto en la PC. Lo que generes se guarda en la carpeta Salida del programa.' + (d.rhubarb ? '' : ' (No encontré Rhubarb: las bocas saldrán simples.)')
    : 'Lo que generes se descarga o se comparte desde acá.';
  // actualización automática del celu/web (ver sw.js). En la PC no hace falta (servir.py ya manda siempre lo último) y además
  // el service worker se come el aviso de «cerré la ventana»: ahí se saca.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    if (d && d.pc) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
    else navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // en la PC: avisarle a servir.py que esta ventana sigue abierta (cuando se cierra, la caja negra se cierra sola)
  if (d && d.pc) {
    const id = Math.random().toString(36).slice(2);
    const latir = () => fetch('/pc/latido?id=' + id, { cache: 'no-store' }).catch(() => {});
    latir(); setInterval(latir, 5000);
    addEventListener('pagehide', () => { try { navigator.sendBeacon('/pc/adios?id=' + id); } catch (e) {} });
  }
});
if (location.hash) abrir(location.hash.slice(1), false);
</script>
</body>
</html>
